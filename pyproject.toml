[project]
name = "gainmiles-product-catalog"
version = "0.1.0"
description = "GainMiles product catalog API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.1,<4",
    "flask-sqlalchemy>=3.1,<4",
    "sqlalchemy>=2.0,<2.1",
    "flask-migrate>=4.1,<5",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "mypy>=1.15,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "flask_migrate"
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
